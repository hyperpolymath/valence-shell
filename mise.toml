[tools]
# Language runtimes
rust = "latest"
zig = "latest"
bun = "latest"
denojs = "latest"

# Package managers
pnpm = "latest"
cargo = "latest"
go-task = "latest"

# Formatting & Linting
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
ninja = "latest"

# Shell tools
git = "latest"
gnu-sed = "latest"
gnu-tar = "latest"
gnu-grep = "latest"

# Testing

[env]
# Common environment variables

# Task runner alias
[alias]
task = "go-task"

# Runnable commands (the [alias] table is for tool-version aliases only)
[tasks.build]
description = "Build the Rust CLI"
dir = "impl/rust-cli"
run = "cargo build --release"

[tasks.test]
description = "Test the Rust CLI"
dir = "impl/rust-cli"
run = "cargo test"

[tasks.lint]
description = "Check formatting with the pinned Prettier"
run = "bun install --frozen-lockfile && bunx --no-install --bun prettier --check ."

[tasks.fmt]
description = "Format with the pinned Prettier"
run = "bun install --frozen-lockfile && bunx --no-install --bun prettier --write ."
