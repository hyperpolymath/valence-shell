# SPDX-License-Identifier: MPL-2.0
# Comprehensive Compilation Tests - Layer 8
#
# Tests compilation across:
# - Multiple Rust versions (stable, beta, nightly, MSRV)
# - Supported platforms (Linux, macOS)
# - Different feature combinations
# - Cross-compilation targets supported by cross on Linux

name: Compilation Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'impl/rust-cli/**'
      - '.github/workflows/compilation_tests.yml'
  pull_request:
    paths:
      - 'impl/rust-cli/**'
      - '.github/workflows/compilation_tests.yml'

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================
  # Matrix: Rust Versions × Platforms
  # ============================================================

  test_matrix:
    name: Test (${{ matrix.rust }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, nightly]
        # vsh uses POSIX shell/process semantics and Unix-specific APIs.
        # Windows support should return as a dedicated porting track, not as a
        # required PR gate that cannot compile the current crate.
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@6d9817901c499d6b02debbb57edb38d33daa680b
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: impl/rust-cli/target
          key: ${{ runner.os }}-cargo-build-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (debug)
        working-directory: impl/rust-cli
        run: cargo build --verbose

      - name: Build (release)
        working-directory: impl/rust-cli
        run: cargo build --release --verbose

      - name: Run tests
        working-directory: impl/rust-cli
        run: cargo test --verbose

      # The ignored stress suite (tests/stress_tests.rs) gates the build. It was
      # repaired on 2026-11-17 (see docs/audits/2026-11-16-hypatia-remediation.adoc)
      # and runs in 30-50 s locally, so 5 minutes leaves wide margin for a slow
      # runner; there is deliberately no continue-on-error (Hypatia RE005).
      # Linux only: stress_deep_nesting_1000_levels needs 1000 directory levels
      # in one absolute path (~2,000 bytes), which fits Linux's PATH_MAX of 4096
      # but not macOS's 1024.
      - name: Run ignored tests (stress)
        if: runner.os == 'Linux'
        working-directory: impl/rust-cli
        timeout-minutes: 5
        run: cargo test --test stress_tests -- --ignored --test-threads=1

  # ============================================================
  # MSRV (Minimum Supported Rust Version)
  # ============================================================

  test_msrv:
    name: Test MSRV (1.88.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@6d9817901c499d6b02debbb57edb38d33daa680b
        with:
          toolchain: 1.88.0

      - name: Check MSRV compilation
        working-directory: impl/rust-cli
        run: cargo check --locked --verbose

  # ============================================================
  # Feature Combinations
  # ============================================================

  test_features:
    name: Test Features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--features echidna"
          - "--all-features"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6d9817901c499d6b02debbb57edb38d33daa680b
        with:
          toolchain: stable

      - name: Build with features
        working-directory: impl/rust-cli
        run: cargo build ${{ matrix.features }} --verbose

      - name: Test with features
        working-directory: impl/rust-cli
        run: cargo test ${{ matrix.features }} --verbose

  # ============================================================
  # Cross-Compilation Targets
  # ============================================================

  cross_compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl      # Alpine Linux
          - aarch64-unknown-linux-gnu      # ARM64 Linux

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6d9817901c499d6b02debbb57edb38d33daa680b
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cross-compile
        working-directory: impl/rust-cli
        run: cross build --target ${{ matrix.target }} --verbose

  # ============================================================
  # Clippy & Rustfmt
  # ============================================================

  lint:
    name: Lint (clippy + rustfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust stable with clippy & rustfmt
        uses: dtolnay/rust-toolchain@6d9817901c499d6b02debbb57edb38d33daa680b
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Run clippy
        working-directory: impl/rust-cli
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check formatting
        working-directory: impl/rust-cli
        run: cargo fmt -- --check

  # ============================================================
  # Documentation Build
  # ============================================================

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6d9817901c499d6b02debbb57edb38d33daa680b
        with:
          toolchain: stable

      - name: Build docs
        working-directory: impl/rust-cli
        run: cargo doc --no-deps --all-features --verbose
        env:
          RUSTDOCFLAGS: -D warnings

  # ============================================================
  # Build Artifacts (Release)
  # ============================================================

  build_release:
    name: Build release artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: vsh-linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: vsh-macos-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6d9817901c499d6b02debbb57edb38d33daa680b
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build release
        working-directory: impl/rust-cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: impl/rust-cli/target/${{ matrix.target }}/release/vsh
          retention-days: 30
