# SPDX-License-Identifier: MPL-2.0
# Instant Forge Sync - Triggers propagation to all forges on push/release
name: Instant Sync
on:
  push:
    branches: [main, master]
  release:
    types: [published]
permissions:
  actions: read
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Presence-gate the dispatch on the secret: `secrets.*` is not usable in
    # `if:`, so surface it via a job-level env var and skip the step when the
    # token is absent (forks / secret not configured) instead of failing.
    env:
      FARM_DISPATCH_TOKEN: ${{ secrets.FARM_DISPATCH_TOKEN }}
    steps:
      # Hypatia RE001: this job holds FARM_DISPATCH_TOKEN, so outbound
      # traffic is limited to the GitHub API that repository-dispatch calls.
      - name: Restrict outbound requests before using the dispatch token
        if: ${{ env.FARM_DISPATCH_TOKEN != '' }}
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
      - name: Trigger Propagation
        if: ${{ env.FARM_DISPATCH_TOKEN != '' }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v3
        with:
          token: ${{ env.FARM_DISPATCH_TOKEN }}
          repository: hyperpolymath/.git-private-farm
          event-type: propagate
          client-payload: |-
            {
              "repo": "${{ github.event.repository.name }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "forges": ""
            }
      - name: Confirm
        run: echo "::notice::Propagation triggered for ${{ github.event.repository.name }}"
